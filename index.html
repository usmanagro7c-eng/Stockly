<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1f26" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Stockly" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Stockly — Inventory &amp; Profit Manager</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('stockly-theme') || 'dark';
          var doc = document.documentElement;
          if (t === 'light') {
            doc.classList.add('light');
          } else if (t === 'oled') {
            doc.classList.add('dark', 'oled');
          } else {
            doc.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/Stockly-Logo-light.png" type="image/png" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/Stockly-Logo-dark.png" type="image/png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="/icons/icon-512.png" type="image/png" sizes="512x512" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-capacitor.tsx"></script>
  </body>
</html>
